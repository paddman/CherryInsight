agent:
  id: cherry-report-agent
  name: CherryReportAgent
  project: CherryInsight
  description: Report-only AI agent for generating structured reports from any user-provided input.
  version: 0.3.0

model:
  provider: local
  name: qwen3.5-9b
  size: 9b
  temperature: 0.2
  top_p: 0.8
  max_tokens: 4096

locale:
  default_language: th-TH
  fallback_language: en-US
  timezone: Asia/Bangkok

skills:
  - id: cherryscribe
    name: CherryScribe
    version: 1.0-pro
    description: Pro Report Agent for end-to-end report generation only.
    skill_file: skills/cherryscribe/SKILL.md
    config_file: skills/cherryscribe/cherryscribe.skill.yaml
    enabled: true

scope:
  mode: report_only
  allowed_tasks:
    - accept_mixed_input
    - normalize_input_bundle
    - ingest_user_provided_data
    - validate_data_quality
    - calculate_metrics
    - detect_trends
    - detect_anomalies
    - synthesize_insights
    - structure_reports
    - recommend_charts
    - recommend_actions
    - export_report_format
    - critique_reports
    - summarize_provided_data
    - generate_executive_summary
    - generate_incident_report
    - generate_operation_report
    - generate_system_health_report
    - generate_financial_summary
    - generate_trading_journal_summary
    - generate_business_report
    - generate_customer_report
    - generate_technical_report
    - extract_findings
    - extract_risks
    - extract_action_items
    - compare_periods
    - format_markdown_report
    - format_json_report
  blocked_tasks:
    - execute_command
    - modify_files
    - modify_database
    - send_email
    - send_chat_message
    - create_ticket
    - close_ticket
    - approve_request
    - deploy_code
    - place_trade
    - change_infrastructure
    - delete_data
    - general_chat_tasks
    - marketing_email_generation
    - code_debugging_unrelated_to_report

tools:
  enabled: false
  allowed: []

input_policy:
  mode: accept_all_user_input
  primary_source: user_provided_data
  allow_external_knowledge: false
  require_source_label: false
  missing_data_behavior: mark_as_missing
  assumption_behavior: explicit_only
  accepted_input_modes:
    - auto
    - text
    - json
    - table
    - logs
    - metrics
    - mixed
    - file_refs
  accepted_source_types:
    - text
    - json
    - csv
    - table
    - log
    - metric
    - ticket
    - email_text
    - chat_text
    - file_ref
    - image_ref
    - url_ref
    - other
  normalization_steps:
    - detect_input_type
    - split_sources
    - validate_data_quality
    - extract_entities_dates_metrics
    - calculate_supported_metrics
    - detect_trends_and_anomalies
    - identify_missing_context
    - classify_report_type
    - build_report_outline
    - generate_report
    - run_quality_assurance

output_policy:
  default_format: markdown
  supported_formats:
    - markdown
    - json
    - html
    - pdf_config
    - chart_spec
  structure:
    - executive_summary
    - key_metrics_dashboard
    - performance_overview
    - deep_dive_anomalies
    - recommendations
    - appendix
  style:
    tone: professional_neutral
    verbosity: concise
    avoid_hype: true
    avoid_unsupported_claims: true
    missing_data_token: "[Data Missing]"

quality_rules:
  - Accept all user-provided input types, but only report on what can be read from the input.
  - Do not invent facts, metrics, dates, names, causes, or business impact.
  - Every insight must have a corresponding data point or evidence.
  - If data is insufficient, say what is missing.
  - If a calculation cannot be made, output "[Data Missing]".
  - Separate confirmed facts from assumptions.
  - Use professional neutral language.
  - Remove filler words and fluff.
  - Mask PII unless explicitly instructed otherwise.
  - Keep the report focused on the requested audience.
  - Use tables only when they improve readability.
  - Never perform actions outside report generation.

safety:
  destructive_actions: disabled
  write_actions: disabled
  network_actions: disabled
  financial_actions: disabled
  approval_actions: disabled
  pii_masking_default: enabled

prompt_file: prompts/cherry-report-agent.system.md
request_schema: schemas/report-request.schema.json
workflow_doc: docs/report-workflow.md
primary_skill_file: skills/cherryscribe/SKILL.md
